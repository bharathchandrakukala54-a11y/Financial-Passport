  <style>

    .request-card{background:#fff;border:1px solid #f0d7b4;border-radius:15px;padding:14px 13px 12px;box-shadow:0 4px 14px rgba(143,107,51,.07)}.pill{font-size:9px;line-height:1;padding:6px 8px;border-radius:20px;display:inline-block;font-weight:700}.pill.pending{background:var(--amber-soft);color:#b9751e}.pill.pending:before{content:'●';font-size:8px;margin-right:5px}.request-card h2{font-size:19px;line-height:1.22;margin:10px 0 8px;font-weight:550;letter-spacing:-.35px}.request-card>p{font-size:11px;line-height:1.45;color:var(--muted);margin:0 0 10px}.request-items{border-top:1px solid var(--line);padding-top:9px}.request-item{display:flex;gap:10px;padding:5px 0}.item-icon{width:29px;height:29px;border-radius:8px;background:#fff1d9;color:#c7852a;display:grid;place-items:center;flex:none}.item-icon svg{width:16px;height:16px}.request-item strong{display:block;font-size:10px;margin:1px 0 3px}.request-item span{font-size:9px;line-height:1.35;color:var(--muted);display:block}.notice{display:flex;align-items:center;gap:8px;background:#e8eff7;border-radius:10px;color:#627d9b;padding:10px 11px;font-size:10px;margin:10px 0}.notice svg{height:16px;width:16px;flex:none}.primary{background:var(--navy);border:0;border-radius:11px;color:#fff;height:48px;width:100%;font-size:12px;font-weight:650;box-shadow:0 7px 13px #173f6e27}.primary:hover{background:var(--navy-dark)}.primary .arrow{font-size:17px;vertical-align:-1px;margin-right:9px}

    .history-tools{display:flex;justify-content:space-between;align-items:center;margin:2px 0 12px;font-size:10px}.active-count{display:flex;align-items:center;gap:6px}.active-count .shield{color:var(--green);font-size:14px}.filter{border:0;background:#fff;border-radius:9px;padding:6px 9px;color:#617995;font-size:10px}.history-list{display:grid;gap:10px}.history-card{background:#fff;border-radius:13px;padding:10px;box-shadow:var(--shadow)}.history-top{display:flex;align-items:center;gap:9px;margin-bottom:7px}.history-top .avatar{width:30px;height:30px;border-radius:8px;font-size:10px}.history-top strong{font-size:11px;font-weight:600;flex:1}.status{font-size:9px;border-radius:20px;padding:5px 8px;font-weight:650}.status.active{background:var(--green-soft);color:var(--green)}.status.active:before{content:'●';font-size:8px;margin-right:4px}.status.expired{background:#eef1f5;color:#718096}.status.revoked{background:#fceaea;color:var(--red)}.shared-label{font-size:8px;color:#9aa6b5;margin-bottom:2px}.shared-label:before{content:'▤';font-size:11px;margin-right:6px;color:#8798ae}.shared-data{font-size:9px;color:#4d5b6e;line-height:1.35;margin:0 0 7px 19px}.dates{display:grid;grid-template-columns:1fr 1fr;margin-bottom:7px}.date-label{display:block;font-size:8px;color:#9aa6b5;margin-bottom:2px}.date-value{font-size:9px;font-weight:650}.date-value.expiry{color:#d58425}.revoke{width:100%;height:29px;border:1px solid #efbaba;border-radius:8px;background:#fff;color:var(--red);font-size:9px;font-weight:650}.revoke:hover{background:#fff5f5}.revoke svg{width:12px;height:12px;vertical-align:-2px;margin-right:4px}.revoke:disabled{display:none}
    .bottom-nav{height:61px;flex:none;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:5px 13px 4px}.nav-btn{border:0;background:transparent;color:#9aa6b7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;position:relative}.nav-btn svg{height:17px;width:17px}.nav-btn.active{color:var(--navy);font-weight:650}.nav-btn.active:before{content:'';position:absolute;top:2px;width:27px;height:24px;border-radius:12px;background:#eaf1f8;z-index:0}.nav-btn svg,.nav-btn span{z-index:1}.nav-dot{width:5px;height:5px;background:#d88720;border-radius:50%;position:absolute;top:9px;right:calc(50% - 13px)}
    .toast{position:absolute;left:16px;right:16px;bottom:73px;background:#163f6d;color:#fff;border-radius:12px;padding:12px 14px;font-size:11px;box-shadow:0 8px 24px #14355640;z-index:5;animation:rise .2s ease}@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}.empty-filter{text-align:center;color:var(--muted);padding:30px 10px;background:#fff;border-radius:12px;font-size:12px}.modal-backdrop{position:absolute;inset:0;background:#14273d66;display:grid;place-items:center;padding:24px;z-index:10}.modal{background:#fff;border-radius:18px;padding:24px 20px;text-align:center;max-width:330px;box-shadow:0 18px 50px #12263d55}.success-icon{width:50px;height:50px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin:0 auto 12px;font-size:25px}.modal h2{font-size:19px;margin:0 0 7px}.modal p{font-size:11px;line-height:1.5;color:var(--muted);margin:0 0 16px}.modal .primary{height:43px}

:9px;color:#9aa6b5;line-height:1.5;margin:18px 10px 0}.phone-input{width:100%;height:48px;border:1px solid #d9e1e9;border-radius:10px;padding:0 13px;background:#fff;font:inherit;font-size:14px;letter-spacing:.5px;margin:7px 0 12px;outline:none}.phone-input:focus{border-color:#7298bf;box-shadow:0 0 0 3px #e6eff8}.otp-row{display:flex;gap:8px;justify-content:center;margin:20px 0}.otp-box{height:47px;width:45px;border:1px solid #d9e1e9;border-radius:10px;background:#fff;text-align:center;font-size:19px;color:var(--ink);outline:none}.otp-box:focus{border-color:#7298bf;box-shadow:0 0 0 3px #e6eff8}.profile-card-full{min-height:auto;padding:14px;display:flex;align-items:center;gap:12px;text-align:left}.profile-card-full .card-icon{margin:0}.profile-card-full .profile-copy{flex:1}.profile-card-full .card-name{font-size:12px}.profile-card-full .card-value{margin-bottom:0}.profile-card-full .arrow{color:#9aa6b5;font-size:20px}.view-btn{border:1px solid #cbd8e5;background:#f6f9fc;color:var(--navy);border-radius:7px;padding:5px 10px;font-size:9px;font-weight:650}.loading-mark{display:inline-block;width:17px;height:17px;border:2px solid #ffffff70;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-4px;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:520px){body{padding:0;background:var(--bg)}.phone{width:100%;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}.scroll{padding-left:17px;padding-right:17px}.bottom-nav{height:64px;padding-bottom:max(4px,env(safe-area-inset-bottom))}.status{padding-top:max(8px,env(safe-area-inset-top))}}
    @media(min-width:700px){.phone{height:min(900px,calc(100vh - 56px))}}
  </style>

<body>
<main class="phone" aria-label="Financial Passport demo">
  <div class="status"><span>9:41</span><span class="status-icons">▮▮▮ ◉ ▰</span></div>
  <div class="scroll" id="screen-content"></div>
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-btn" data-screen="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button class="nav-btn" data-screen="request"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M8 5V3h8v2M7 11h10M7 15h6"/></svg><span>Requests</span><i class="nav-dot"></i></button>
    <button class="nav-btn" data-screen="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span>Access</span></button>
  </nav>

</main>
<script>
  const icons={shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 20 6v5c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6z"/><path d="m9 12 2 2 4-4"/></svg>',bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>',income:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M7 14h4"/></svg>',bank:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m3 9 9-5 9 5M4 10h16M5 19h14M7 10v7m5-7v7m5-7v7M3 21h18"/></svg>',loan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',invest:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V5m0 14h17M7 15l4-4 3 2 6-7M16 6h4v4"/></svg>',insurance:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3 20 6v5c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6z"/><path d="m9 12 2 2 4-4"/></svg>',docs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h10l4 4v12H5zM15 4v5h4M8 13h8m-8 3h8"/></svg>',coin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M15 8.5c-.6-.5-1.5-.8-2.6-.8-1.4 0-2.4.7-2.4 1.8s.9 1.6 2.4 1.9 2.6.8 2.6 2-.9 2-2.7 2c-1.1 0-2.2-.4-3-1M12 6v12"/></svg>',file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 3h10l4 4v14H5zM15 3v5h4M8 13h8m-8 4h8"/></svg>',lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></svg>',revoke:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 20 6v5c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6z"/><path d="m9 9 6 6m0-6-6 6"/></svg>'};
  const requested=[['Income','Monthly income and employment verification','coin'],['Bank Account Verification','To verify account ownership and regular salary credits.','bank'],['Existing Loan Info','To assess your current obligations and debt-to-income ratio.','file']];
  const options=[['Income','Monthly income and employment verification'],['Bank Account Verification','Ownership and salary credit confirmation'],['Existing Loan Info','Current balances and repayment obligations'],['Investment Details','Holdings, balances, and asset allocation'],['Full Transaction History','Complete account activity and descriptions']];
  let screen='welcome',duration=30,filter='All',toastTimer=null,phoneNumber='',googleTimer=null,detailName='Income';
  let selected=new Set(['Income','Bank Account Verification','Existing Loan Info']);
  let entries=[{id:'abc',org:'ABC Finance',initials:'AF',data:'Income, bank verification, existing loan info',granted:'Sep 27, 2026',expires:'Oct 27, 2026',status:'Active',revoke:true},{id:'nova',org:'Nova Rentals',initials:'NR',data:'Income and bank account verification',granted:'Sep 12, 2026',expires:'Nov 11, 2026',status:'Active',revoke:true},{id:'harbor',org:'Harbor Bank',initials:'HB',data:'Income, investments, existing loan info',granted:'May 04, 2026',expires:'Aug 02, 2026',status:'Expired'},{id:'shield',org:'ShieldSure Insurance',initials:'SI',data:'Income and insurance policies',granted:'Apr 18, 2026',expires:'Jul 17, 2026',status:'Expired'}];
  function header(title,subtitle,back=true,action=true){return `<header class="topbar">${back?`<button class="back-btn" data-go="${screen==='consent'?'request':'home'}" aria-label="Go back">‹</button>`:`<span class="brand-mark">${icons.shield}</span>`}<div class="heading"><h1>${title}</h1><p>${subtitle}</p></div>${action==='profile'?`<button class="icon-btn" data-go="request" aria-label="View incoming request">${icons.bell}<i class="dot"></i></button><button class="icon-btn" data-go="profile" aria-label="Open your profile" style="margin-left:-5px;color:var(--navy);font-size:11px;font-weight:700">JD</button>`:action===false?`<button class="icon-btn" data-go="request" aria-label="View incoming request">${icons.bell}<i class="dot"></i></button>`:action===null?'':`<span class="secure">SECURE</span>`}</header>`}
  function home(){return `${header('Financial Passport','Your verified financial profile',false,'profile')}<section class="snapshot"><div class="snapshot-head"><span>Financial snapshot</span><span class="updated">${icons.shield} Updated today</span></div><div class="metrics"><div class="metric"><span>Income</span><strong>₹1,25,000</strong></div><div class="metric"><span>Expenses</span><strong>₹62,000</strong></div><div class="metric"><span>Assets</span><strong>₹46,60,000</strong></div><div class="metric"><span>Liabilities</span><strong>₹28,40,000</strong></div></div></section><div class="section-title"><span>Your financial profile</span><button class="text-button" data-go="history">Manage</button></div><div class="cards">${[['Income','₹1,25,000 / month','Verified','income','good'],['Bank Accounts','3 connected','Up to date','bank',''],['Loans & Liabilities','₹28,40,000 total','2 accounts','loan',''],['Investments','₹20,25,000','+6.4% YTD','invest',''],['Insurance','4 active policies','Protected','insurance','good'],['Financial Documents','12 documents','Encrypted','docs','']].map(([name,value,note,icon,good])=>`<button class="profile-card" data-card="${name}"><span class="card-icon">${icons[icon]}</span><span class="card-name">${name}</span><span class="card-value">${value}</span><span class="card-note ${good}">${note}</span></button>`).join('')}</div>`}
  const profiles={
    'Income':{icon:'income',intro:'Verified monthly income and employment details.',html:`<div class="summary-card"><span class="label">TOTAL MONTHLY INCOME</span><div class="value">₹1,25,000</div><div class="summary-foot"><span>Net deposits, average</span><span>Updated Sep 24, 2026</span></div></div><div class="detail-list"><article class="data-card"><div class="data-card-head"><span class="card-icon">${icons.income}</span><strong>Tata Consultancy Services</strong><span class="badge-verified">✓ Verified</span></div><div class="data-grid"><div class="data-cell"><span class="label">Salary</span><span class="value">₹1,10,000 / month</span></div><div class="data-cell"><span class="label">Employment status</span><span class="value">Full-time · 4 years</span></div></div></article><article class="data-card"><div class="data-card-head"><span class="card-icon">${icons.coin}</span><strong>Other income</strong></div><div class="data-grid"><div class="data-cell"><span class="label">Consulting & dividends</span><span class="value">₹15,000 / month</span></div><div class="data-cell"><span class="label">Last updated</span><span class="value">September 24, 2026</span></div></div></article></div>`},
    'Bank Accounts':{icon:'bank',intro:'Three verified accounts connected to your profile.',html:`<div class="detail-list">${[['HDFC Bank','•••• 4821','Savings','₹4,82,160'],['ICICI Bank','•••• 1907','Salary account','₹2,89,450'],['State Bank of India','•••• 6634','Savings','₹1,04,275']].map(([bank,mask,type,balance])=>`<article class="data-card"><div class="data-card-head"><span class="card-icon">${icons.bank}</span><strong>${bank}</strong><span class="badge-verified">Connected</span></div><p>${type} · ${mask}</p><div class="data-grid"><div class="data-cell"><span class="label">Available balance</span><span class="value">${balance}</span></div><div class="data-cell"><span class="label">Account status</span><span class="value" style="color:var(--green)">Verified</span></div></div></article>`).join('')}</div>`},
    'Loans & Liabilities':{icon:'loan',intro:'Two open loans · ₹28,40,000 total outstanding.',html:`<div class="detail-list">${[['HDFC Bank','Home loan','₹25,00,000','₹24,850 / month','18 years 4 months'],['Bajaj Finance','Two-wheeler loan','₹3,40,000','₹11,200 / month','2 years 1 month']].map(([lender,type,amount,emi,tenure])=>`<article class="data-card"><div class="data-card-head"><span class="card-icon">${icons.loan}</span><strong>${lender}</strong><span class="badge-verified">Current</span></div><p>${type}</p><div class="data-grid"><div class="data-cell"><span class="label">Outstanding</span><span class="value">${amount}</span></div><div class="data-cell"><span class="label">Monthly EMI</span><span class="value">${emi}</span></div><div class="data-cell"><span class="label">Tenure remaining</span><span class="value">${tenure}</span></div><div class="data-cell"><span class="label">Payment status</span><span class="value" style="color:var(--green)">On schedule</span></div></div></article>`).join('')}</div>`},
    'Investments':{icon:'invest',intro:'Diversified holdings · performance through September 2026.',html:`<div class="summary-card"><span class="label">TOTAL PORTFOLIO VALUE</span><div class="value">₹20,25,000</div><div class="summary-foot"><span>Overall return</span><span style="color:#a4e4c7">+₹1,22,000 · +6.4% YTD</span></div></div><div class="detail-list">${[['Mutual funds','SBI Nifty 50 Index Fund','₹12,40,000','+7.8%'],['Stocks','Reliance Industries · 42 shares','₹4,25,000','+5.2%'],['Fixed deposit','SBI 12-month FD','₹3,60,000','+3.1%']].map(([type,name,value,returns])=>`<article class="data-card"><div class="data-card-head"><span class="card-icon">${icons.invest}</span><strong>${type}</strong><span style="font-size:10px;color:var(--green);font-weight:650">${returns}</span></div><p>${name}</p><div class="data-grid"><div class="data-cell"><span class="label">Current value</span><span class="value">${value}</span></div><div class="data-cell"><span class="label">Return</span><span class="value" style="color:var(--green)">${returns}</span></div></div></article>`).join('')}</div>`},
    'Insurance':{icon:'insurance',intro:'Four active policies protecting your household.',html:`<div class="detail-list">${[['ICICI Lombard','Motor · Hyundai Creta','₹15,00,000','₹14,200 / year','Nov 18, 2026'],['Star Health','Family health · Family Health Optima','₹10,00,000','₹28,500 / year','Jan 01, 2027'],['HDFC Life','Term life · Click 2 Protect','₹1,00,00,000','₹18,600 / year','Mar 12, 2027'],['LIC','Personal accident · Jeevan Arogya','₹5,00,000','₹9,800 / year','Dec 05, 2026']].map(([provider,type,coverage,premium,renewal])=>`<article class="data-card"><div class="data-card-head"><span class="card-icon">${icons.insurance}</span><strong>${provider}</strong><span class="badge-verified">Active</span></div><p>${type}</p><div class="data-grid"><div class="data-cell"><span class="label">Coverage</span><span class="value">${coverage}</span></div><div class="data-cell"><span class="label">Premium</span><span class="value">${premium}</span></div><div class="data-cell"><span class="label">Renewal date</span><span class="value">${renewal}</span></div></div></article>`).join('')}</div>`},
    'Financial Documents':{icon:'docs',intro:'Your encrypted, verified financial documents.',html:`<div class="detail-list">${[['FY 2025 Income Tax Return','Income tax return','Aug 14, 2026','Verified'],['TCS Salary Slip — Aug 2026','Salary slip','Sep 02, 2026','Verified'],['HDFC Bank Statement — Aug 2026','Bank statement','Sep 03, 2026','Verified'],['HDFC Home Loan Annual Summary','Loan statement','Jan 16, 2026','Verified'],['Star Health Coverage Summary','Insurance document','Jun 10, 2026','In review']].map(([name,type,date,status])=>`<article class="data-card"><div class="data-card-head"><span class="card-icon">${icons.docs}</span><strong>${name}</strong><button class="view-btn" data-view="${name}">View</button></div><div class="data-grid"><div class="data-cell"><span class="label">Document type</span><span class="value">${type}</span></div><div class="data-cell"><span class="label">Uploaded</span><span class="value">${date}</span></div><div class="data-cell"><span class="label">Verification</span><span class="value" style="color:${status==='Verified'?'var(--green)':'var(--amber)'}">${status}</span></div></div></article>`).join('')}</div>`}
  };
  function detail(){const d=profiles[detailName];return `${header(detailName,'Verified financial information')}<p class="detail-intro">${d.intro}</p>${d.html}`}
  function welcome(){return `<section class="signin"><div class="signin-logo">${icons.shield}</div><h1>Sign in to<br>Financial Passport</h1><p class="lead">Your verified financial profile, securely in one place.</p><button class="auth-btn primary-auth" data-go="mobile">Continue with Mobile Number</button><button class="auth-btn" data-google><span class="google-g">G</span>Continue with Google</button><p class="auth-legal">Your information is encrypted and always under your control.</p></section>`}
  function mobile(){return `<section class="signin">${header('Sign in with mobile','A secure one-time code will verify your number.',true,null)}<label for="mobile-number" style="display:block;text-align:left;font-size:10px;font-weight:650">Mobile number</label><input id="mobile-number" class="phone-input" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" value="${phoneNumber}"><button class="primary" data-send-otp>Send OTP</button><p class="auth-legal">For this demo, no SMS will be sent. Enter any 10-digit number to continue.</p></section>`}
  function otp(){return `<section class="signin">${header('Verify your number',`Enter the code sent to +91 ${phoneNumber}`,true,null)}<p class="intro" style="text-align:center">Enter any 4–6 digits to complete this demo sign-in.</p><div class="otp-row">${[1,2,3,4,5,6].map((n)=>`<input class="otp-box" maxlength="1" inputmode="numeric" aria-label="Code digit ${n}">`).join('')}</div><button class="primary" data-verify>Verify</button><p class="auth-legal">This mocked verification accepts any code.</p></section>`}
  function profile(){return `${header('Your Profile','Personal account details',true,null)}<div class="institution"><span class="avatar">JD</span><div><strong>Jordan Davis</strong><small>Verified profile owner</small></div><span class="badge-verified">✓ Verified</span></div><div class="detail-list"><article class="data-card"><p class="label">MOBILE NUMBER</p><p class="value">+91 ${phoneNumber||'98765 43210'}</p></article><article class="data-card"><p class="label">EMAIL ADDRESS</p><p class="value">jordan.davis@email.com</p></article><article class="data-card"><p class="label">PROFILE STATUS</p><p class="value" style="color:var(--green)">Identity verified · Updated Sep 24, 2026</p></article></div><button class="primary" style="margin-top:14px;background:#fff;color:var(--red);border:1px solid #efbaba;box-shadow:none" data-signout>Sign Out</button>`}
  function request(){return `${header('Incoming Request','Review before sharing')}<div class="institution"><span class="avatar">AF</span><div><strong>ABC Finance</strong><small>Verified financial institution</small></div><span class="verified">⛨</span></div><section class="request-card"><span class="pill pending">PENDING REQUEST</span><h2>ABC Finance requests access — Home Loan Application</h2><p>The following verified information is requested to process your application.</p><div class="request-items">${requested.map(([name,why,icon])=>`<div class="request-item"><span class="item-icon">${icons[icon]}</span><div><strong>${name}</strong><span>${why}</span></div></div>`).join('')}</div></section><div class="notice">${icons.lock}<span>Nothing is shared until you review and consent.</span></div><button class="primary" data-go="consent"><span class="arrow">→</span>Review Request</button>`}
  function consent(){return `${header('Select What to Share','ABC Finance · Home Loan')}<p class="intro">Choose only the information you're comfortable sharing.</p><div class="checklist">${options.map(([name,desc])=>`<div class="check-row" role="checkbox" aria-checked="${selected.has(name)}" tabindex="0" data-item="${name}"><span class="check"></span><span class="check-copy"><strong>${name}</strong><span>${desc}</span></span></div>`).join('')}</div><div class="duration-head"><span>Access duration</span><span class="limited">Time-limited</span></div><div class="durations">${[30,60,90].map(d=>`<button class="duration ${duration===d?'selected':''}" data-duration="${d}">${d} days</button>`).join('')}</div><div class="share-summary"><span class="seal">${icons.shield}</span><span>You are sharing ${selected.size} of 5 items for ${duration} days</span></div><button class="primary" style="background:var(--green)" data-consent ${selected.size===0?'disabled':''}>${icons.lock} &nbsp;Give Consent &amp; Share Securely</button><p class="fine-print">You can revoke access at any time from Access history.</p>`}
  function history(){let shown=entries.filter(e=>filter==='All'||e.status===filter);return `${header('Access History','Manage shared data permissions',false,false)}<div class="history-tools"><span class="active-count"><span class="shield">♧</span>${entries.filter(e=>e.status==='Active').length} active permissions</span><button class="filter" data-filter>${filter==='All'?'☷':'✓'} &nbsp;${filter}</button></div><div class="history-list">${shown.length?shown.map(e=>`<article class="history-card"><div class="history-top"><span class="avatar">${e.initials}</span><strong>${e.org}</strong><span class="status ${e.status.toLowerCase()}">${e.status}</span></div><div class="shared-label">SHARED DATA</div><p class="shared-data">${e.data}</p><div class="dates"><div><span class="date-label">GRANTED</span><span class="date-value">${e.granted}</span></div><div><span class="date-label">${e.status==='Expired'?'EXPIRED':'EXPIRES'}</span><span class="date-value ${e.status==='Active'?'expiry':''}">${e.expires}</span></div></div>${e.status==='Active'?`<button class="revoke" data-revoke="${e.id}">${icons.revoke} Revoke Access</button>`:''}</article>`).join(''):`<div class="empty-filter">No ${filter.toLowerCase()} permissions.</div>`}</div>`}
  function render(){const pages={home,request,consent,history,welcome,mobile,otp,profile,detail};document.querySelector('#screen-content').innerHTML=pages[screen]();document.querySelector('.bottom-nav').style.display=['welcome','mobile','otp'].includes(screen)?'none':'grid';document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen||(screen==='consent'&&b.dataset.screen==='request')));document.querySelector('.scroll').scrollTop=0}
  function go(to){screen=to;render()}
  function showToast(message){const host=document.querySelector('#overlay');host.innerHTML=`<div class="toast" role="status">${message}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>host.innerHTML='',2600)}
  function showSuccess(){document.querySelector('#overlay').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="success-title"><div class="success-icon">✓</div><h2 id="success-title">Consent shared securely</h2><p>ABC Finance can access ${selected.size} selected item${selected.size===1?'':'s'} for ${duration} days. You can revoke this permission at any time.</p><button class="primary" data-done>View Access History</button></section></div>`}
  document.addEventListener('click',e=>{const goBtn=e.target.closest('[data-go]');if(goBtn){go(goBtn.dataset.go);return}const nav=e.target.closest('.nav-btn');if(nav){go(nav.dataset.screen);return}const row=e.target.closest('.check-row');if(row){toggleItem(row);return}const dur=e.target.closest('[data-duration]');if(dur){duration=Number(dur.dataset.duration);render();return}const google=e.target.closest('[data-google]');if(google){google.innerHTML='<span class="loading-mark"></span>Connecting securely…';google.disabled=true;googleTimer=setTimeout(()=>go('home'),900);return}if(e.target.closest('[data-send-otp]')){const field=document.querySelector('#mobile-number');const digits=field.value.replace(/\D/g,'').slice(-10);if(digits.length!==10){showToast('Enter a valid 10-digit mobile number.');return}phoneNumber=digits;go('otp');document.querySelector('.otp-box')?.focus();return}if(e.target.closest('[data-verify]')){go('home');showToast('Welcome to your Financial Passport, Jordan.');return}if(e.target.closest('[data-signout]')){phoneNumber='';go('welcome');return}if(e.target.closest('[data-consent]')){if(!selected.size){showToast('Select at least one item to share.');return}let expires=new Date(2026,8,27+duration).toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'});entries[0]={...entries[0],data:[...selected].map(x=>x==='Bank Account Verification'?'bank verification':x==='Existing Loan Info'?'existing loan info':x.toLowerCase()).join(', '),granted:'Sep 27, 2026',expires,status:'Active'};showSuccess();return}if(e.target.closest('[data-done]')){document.querySelector('#overlay').innerHTML='';filter='All';go('history');showToast('Permission added to your access history.');return}const revoke=e.target.closest('[data-revoke]');if(revoke){const ent=entries.find(x=>x.id===revoke.dataset.revoke);if(ent){ent.status='Revoked';render();showToast(`${ent.org} access revoked.`)}return}if(e.target.closest('[data-filter]')){filter=filter==='All'?'Active':filter==='Active'?'Revoked':'All';render();return}const card=e.target.closest('[data-card]');if(card){detailName=card.dataset.card;go('detail');return}const view=e.target.closest('[data-view]');if(view)showToast(`Secure preview opened: ${view.dataset.view}`)});
  document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.check-row')){e.preventDefault();toggleItem(e.target)}if(e.key==='Escape'){document.querySelector('#overlay').innerHTML=''}});
  document.addEventListener('input',e=>{if(e.target.id==='mobile-number'){e.target.value=e.target.value.replace(/\D/g,'').slice(0,10)}if(e.target.matches('.otp-box')){e.target.value=e.target.value.replace(/\D/g,'').slice(-1);if(e.target.value)e.target.nextElementSibling?.focus()}});
  function toggleItem(row){const name=row.dataset.item;selected.has(name)?selected.delete(name):selected.add(name);render()}
  render();
</script>
</body>
</html>
