    .topbar{gap:9px}.brand-mark{width:34px;height:38px;border-radius:0;background:transparent;color:var(--navy);overflow:visible}.brand-mark svg{width:34px;height:38px}.brand-type{display:flex;flex-direction:column;line-height:1.02;min-width:0}.brand-type strong{font:600 19px/1 var(--serif);letter-spacing:-.35px;color:var(--navy)}.brand-type span{font:500 9px/1.3 var(--sans);letter-spacing:1.4px;text-transform:uppercase;color:var(--gold)}

  function settings(){const rows=[['alerts','Important updates','Get a note when a permission changes.'],['monthlySummary','Monthly spending summary','See a simple recap at the start of each month.'],['starredFirst','Show saved documents first','Keep your starred documents at the top of the list.'],['privacyLock','Extra privacy reminder','Show a reminder before sharing financial details.']];return `${header('Settings','Make the app work for you')}<p class="detail-intro">Choose what you want to see. You can change these any time.</p><div class="settings-list">${rows.map(([key,title,desc])=>`<div class="setting-row"><div class="setting-copy"><strong>${title}</strong><small>${desc}</small></div><button class="switch" type="button" role="switch" aria-label="${title}" aria-pressed="${settingsState[key]}" data-setting="${key}"></button></div>`).join('')}</div><section class="data-card" style="margin-top:12px"><div class="data-card-head"><span class="card-icon">${icons.shield}</span><strong>Your data stays under your control</strong></div><p>Only share details when you choose. You can review or stop sharing from Access History.</p><button class="view-btn" data-go="history">Open Access History</button></section><p class="fine-print">Financial Passport demo · Preferences are saved for this session.</p>`}

  function profile(){const name=supabaseUser?getSupabaseUserName(supabaseUser):'Mobile demo session';const initials=name.split(/\s+/).filter(Boolean).slice(0,2).map(part=>part[0]).join('').toUpperCase()||'U';const email=supabaseUser?.email||'No email on this mock mobile session';const phone=supabaseUser?.phone||phoneNumber||'Not linked';return `${header('Your Profile','Personal account details',true,null)}<div class="institution"><span class="avatar">${escapeHtml(initials)}</span><div><strong>${escapeHtml(name)}</strong><small>${supabaseUser?'Signed in with Supabase':'Mock mobile sign-in'}</small></div>${supabaseUser?'<span class="badge-verified">✓ Signed in</span>':''}</div><div class="detail-list"><article class="data-card"><p class="label">MOBILE NUMBER</p><p class="value">${escapeHtml(phone)}</p></article><article class="data-card"><p class="label">EMAIL ADDRESS</p><p class="value">${escapeHtml(email)}</p></article><article class="data-card"><p class="label">PROFILE STATUS</p><p class="value" style="color:var(--green)">${supabaseUser?'Authenticated with Supabase':'Demo profile · No Supabase session'}</p></article></div><button class="primary" style="margin-top:14px;background:#fff;color:var(--red);border:1px solid #efbaba;box-shadow:none" data-signout>Sign Out</button>`}

  function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
  function getSupabaseUserName(user){const metadata=user?.user_metadata||{};return metadata.full_name||metadata.name||[metadata.given_name,metadata.family_name].filter(Boolean).join(' ')||user?.email?.split('@')[0]||'Signed-in user'}
  async function refreshSupabaseUser(notify=false){if(!supabaseClient||!supabaseSession)return null;const {data,error}=await supabaseClient.auth.getUser();if(error){supabaseUser=null;if(notify)showToast(`Unable to load profile: ${escapeHtml(error.message)}`);return null}supabaseUser=data.user;return supabaseUser}
  function handleSupabaseAuthChange(event,session){supabaseSession=session||null;if(event==='SIGNED_OUT'){supabaseUser=null;if(screen!=='welcome')go('welcome');return}if(session&&['INITIAL_SESSION','SIGNED_IN'].includes(event)){window.setTimeout(async()=>{try{await refreshSupabaseUser();if(screen==='welcome')go('home')}catch(error){showToast(`Authentication profile unavailable: ${escapeHtml(error.message)}`)}},0)}}

  async function startGoogleSignIn(button){if(!supabaseClient){showToast('Supabase did not load. Check your internet connection and reload.');return}button.disabled=true;button.innerHTML='<span class="loading-mark"></span>Connecting securely…';try{const request={provider:'google'};if(window.location.protocol!=='file:')request.options={redirectTo:window.location.href};const {error}=await supabaseClient.auth.signInWithOAuth(request);if(error)throw error}catch(error){render();showToast(`Google sign-in failed: ${escapeHtml(error.message)}`)}}

  function render(){const pages={home,request,consent,history,welcome,mobile,otp,profile,detail,spending, 'spend-detail':spendDetail,cibil,settings};document.querySelector('#screen-content').innerHTML=pages[screen]();document.querySelector('.bottom-nav').style.display=['welcome','mobile','otp'].includes(screen)?'none':'grid';document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen||(screen==='consent'&&b.dataset.screen==='request')));if(screen==='spending'){const data=spendData[spendSource],needsPct=Math.round(data.needs/data.total*100),chart=document.createElement('div');chart.className='pie-wrap';chart.innerHTML=`<div class="spend-pie" style="background:conic-gradient(from -90deg,var(--navy) 0 ${needsPct}%,var(--gold) ${needsPct}% 100%)" role="img" aria-label="Spending split: ${needsPct}% needs and ${100-needsPct}% extras"><div class="pie-center"><strong>${data.total?Math.round(data.needs/data.total*100):0}%</strong>needs</div></div><div class="pie-legend"><span class="pie-key"><i class="pie-dot needs"></i>Needs<b>₹${data.needs.toLocaleString('en-IN')}</b></span><span class="pie-key"><i class="pie-dot extras"></i>Extras<b>₹${data.wants.toLocaleString('en-IN')}</b></span></div>`;document.querySelector('.split-card .split-track')?.insertAdjacentElement('afterend',chart)}if(screen==='detail'&&detailName==='Financial Documents'){const list=document.querySelector('.detail-list');if(list){const control=document.createElement('button');control.className='quick-link';control.style.cssText='width:100%;margin:0 0 10px;min-height:44px';control.dataset.starredFilter='';control.setAttribute('aria-pressed',String(showStarredOnly));control.textContent=showStarredOnly?'★ Showing saved documents · tap to show all':'☆ Show saved documents only';list.parentNode.insertBefore(control,list);const cards=[...list.querySelectorAll('.data-card')];if(settingsState.starredFirst)cards.sort((a,b)=>Number(starredDocuments.has(a.querySelector('.data-card-head strong')?.textContent))===Number(starredDocuments.has(b.querySelector('.data-card-head strong')?.textContent))?0:starredDocuments.has(b.querySelector('.data-card-head strong')?.textContent)?1:-1);cards.forEach(card=>{const name=card.querySelector('.data-card-head strong')?.textContent||'';const starred=starredDocuments.has(name);card.classList.toggle('is-starred',starred);const button=document.createElement('button');button.type='button';button.className=`star-btn ${starred?'active':''}`;button.dataset.starDocument=name;button.setAttribute('aria-label',`${starred?'Remove star from':'Star'} ${name}`);button.setAttribute('aria-pressed',String(starred));button.textContent=starred?'★':'☆';card.querySelector('.data-card-head strong')?.after(button);card.hidden=showStarredOnly&&!starred})}}document.querySelector('.scroll').scrollTop=0}

    const destinations={chatgpt:'https://chatgpt.com/',claude:'https://claude.ai/',gemini:'https://gemini.google.com/'};if(target==='whatsapp'){window.open(`https://wa.me/?text=${encodeURIComponent(summary)}`,'_blank','noopener,noreferrer');if(feedback)feedback.textContent='WhatsApp opened with your summary.';return}if(destinations[target]){const copied=await copyShareText(summary);window.open(destinations[target],'_blank','noopener,noreferrer');if(feedback)feedback.textContent=copied?'Summary copied. Paste it into the new chat.':'App opened. Copy the share summary from this confirmation.';return}const copied=await copyShareText(summary);if(feedback)feedback.textContent=copied?'Summary copied. Paste it into any app you choose.':'Your share summary is ready to copy.'}
  function showSuccess(){document.querySelector('#overlay').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="success-title"><div class="success-icon">✓</div><h2 id="success-title">Consent shared securely</h2><p>ABC Finance can access ${selected.size} selected item${selected.size===1?'':'s'} for ${duration} days. You can revoke this permission at any time.</p><h3 class="share-heading">Share a copy via</h3><div class="share-apps" aria-label="Share confirmation summary"><button class="share-app" data-share="whatsapp" aria-label="Share via WhatsApp"><span class="share-app-icon">W</span><span>WhatsApp</span></button><button class="share-app" data-share="chatgpt" aria-label="Share via ChatGPT"><span class="share-app-icon">✳</span><span>ChatGPT</span></button><button class="share-app" data-share="claude" aria-label="Share via Claude"><span class="share-app-icon">C</span><span>Claude</span></button><button class="share-app" data-share="gemini" aria-label="Share via Gemini"><span class="share-app-icon">✦</span><span>Gemini</span></button><button class="share-app" data-share="more" aria-label="Share via more apps"><span class="share-app-icon">···</span><span>More apps</span></button></div><p class="share-note">Only a short summary is shared. No account files or passwords are included.</p><div class="share-feedback" id="share-feedback" aria-live="polite"></div><button class="primary" data-done>View Access History</button></section></div>`}
  document.addEventListener('click',e=>{const share=e.target.closest('[data-share]');if(share){shareConsentCopy(share.dataset.share);return}const setting=e.target.closest('[data-setting]');if(setting){const key=setting.dataset.setting;settingsState[key]=!settingsState[key];render();showToast(`${setting.getAttribute('aria-label')} ${settingsState[key]?'turned on':'turned off'}.`);return}if(e.target.closest('[data-starred-filter]')){showStarredOnly=!showStarredOnly;render();return}const star=e.target.closest('[data-star-document]');if(star){const name=star.dataset.starDocument;if(starredDocuments.has(name))starredDocuments.delete(name);else starredDocuments.add(name);render();showToast(`${name} ${starredDocuments.has(name)?'saved as important':'removed from saved documents'}.`);return}const spendTab=e.target.closest('[data-spend-source]');if(spendTab){spendSource=spendTab.dataset.spendSource;go('spending');return}const spendCategory=e.target.closest('[data-spend-category]');if(spendCategory){selectedSpendCategory=spendCategory.dataset.spendCategory;go('spend-detail');return}const goBtn=e.target.closest('[data-go]');if(goBtn){go(goBtn.dataset.go);return}const nav=e.target.closest('.nav-btn');if(nav){go(nav.dataset.screen);return}const row=e.target.closest('.check-row');if(row){toggleItem(row);return}const dur=e.target.closest('[data-duration]');if(dur){duration=Number(dur.dataset.duration);render();return}const google=e.target.closest('[data-google]');if(google){google.innerHTML='<span class="loading-mark"></span>Connecting securely…';google.disabled=true;googleTimer=setTimeout(()=>go('home'),900);return}if(e.target.closest('[data-send-otp]')){const field=document.querySelector('#mobile-number');const digits=field.value.replace(/\D/g,'').slice(-10);if(digits.length!==10){showToast('Enter a valid 10-digit mobile number.');return}phoneNumber=digits;go('otp');document.querySelector('.otp-box')?.focus();return}if(e.target.closest('[data-verify]')){go('home');showToast('Welcome to your Financial Passport, Jordan.');return}if(e.target.closest('[data-signout]')){phoneNumber='';go('welcome');return}if(e.target.closest('[data-consent]')){if(!selected.size){showToast('Select at least one item to share.');return}let expires=new Date(2026,8,27+duration).toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'});entries[0]={...entries[0],data:[...selected].map(x=>x==='Bank Account Verification'?'bank verification':x==='Existing Loan Info'?'existing loan info':x.toLowerCase()).join(', '),granted:'Sep 27, 2026',expires,status:'Active'};showSuccess();return}if(e.target.closest('[data-done]')){document.querySelector('#overlay').innerHTML='';filter='All';go('history');showToast('Permission added to your access history.');return}const revoke=e.target.closest('[data-revoke]');if(revoke){const ent=entries.find(x=>x.id===revoke.dataset.revoke);if(ent){ent.status='Revoked';render();showToast(`${ent.org} access revoked.`)}return}if(e.target.closest('[data-filter]')){filter=filter==='All'?'Active':filter==='Active'?'Revoked':'All';render();return}const card=e.target.closest('[data-card]');if(card){detailName=card.dataset.card;go('detail');return}const view=e.target.closest('[data-view]');if(view)showToast(`Secure preview opened: ${view.dataset.view}`)});
  document.addEventListener('submit',e=>{const form=e.target.closest('[data-limit-form]');if(!form)return;e.preventDefault();const input=form.querySelector('#spend-limit'),limit=Number(input.value);if(!Number.isFinite(limit)||limit<1000){showToast('Choose a monthly limit of at least ₹1,000.');return}monthlySpendLimit=limit;render();showToast(`Monthly spending limit set to ₹${limit.toLocaleString('en-IN')}.`)});
  document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.check-row')){e.preventDefault();toggleItem(e.target)}if(e.key==='Escape'){document.querySelector('#overlay').innerHTML=''}});
  document.addEventListener('input',e=>{if(e.target.id==='mobile-number'){e.target.value=e.target.value.replace(/\D/g,'').slice(0,10)}if(e.target.matches('.otp-box')){e.target.value=e.target.value.replace(/\D/g,'').slice(-1);if(e.target.value)e.target.nextElementSibling?.focus()}});
  function toggleItem(row){const name=row.dataset.item;selected.has(name)?selected.delete(name):selected.add(name);render()}
  render();
  initializeSupabaseAuth();
</script>
